name: Build Go Scanner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build binaries
      run: |
        go mod init reality-scanner
        go get github.com/refraction-networking/utls
        go get golang.org/x/net/http2/hpack
        go mod tidy
        
        # 1. Сборка для Linux
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o reality-scanner-linux main.go

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: reality-scanner-binaries
        path: |
          reality-scanner-linux
          reality-scanner-windows.exe
