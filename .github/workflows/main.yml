name: Build Go Scanner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build binary
      run: |
        go mod tidy
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o reality-scanner main.go

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: reality-scanner-linux
        path: reality-scanner
